<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CLAUX Creator Mark QA</title>
  <style>
    :root { color: #3B2E2A; background: #F2E2C8; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 48px; }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: .14em; }
    p { margin: 0 0 34px; color: #0D4547; letter-spacing: .08em; }
    section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 30px; }
    figure { display: grid; place-items: center; min-height: 210px; margin: 0; padding: 24px; border: 1px solid rgb(59 46 42 / .18); border-radius: 16px; }
    figure.cocoa { background: #3B2E2A; border-color: #3B2E2A; }
    img { display: block; width: min(100%, 420px); height: auto; }
    .sizes { display: flex; align-items: center; gap: 28px; padding: 28px; background: #fff; border-radius: 16px; overflow: auto; }
  </style>
</head>
<body>
  <h1>CLAUX / CREATOR MARK</h1>
  <p>MADE BY CLAUX &middot; FOOTER ENDORSEMENT &middot; MINIMUM 180 PX WIDE</p>
  <section>
    <figure><img src="../svg/claux-maker-primary.svg" alt="Made by CLAUX primary creator mark"></figure>
    <figure class="cocoa"><img src="../svg/claux-maker-reverse.svg" alt="Made by CLAUX reverse creator mark"></figure>
    <figure><img src="../svg/claux-maker-monochrome-dark.svg" alt="Made by CLAUX monochrome dark creator mark"></figure>
    <figure class="cocoa"><img src="../svg/claux-maker-monochrome-light.svg" alt="Made by CLAUX monochrome light creator mark"></figure>
  </section>
  <div class="sizes">
    <img src="../svg/claux-maker-primary.svg" width="180" style="width:180px" alt="">
    <img src="../svg/claux-maker-primary.svg" width="220" style="width:220px" alt="">
    <img src="../svg/claux-maker-primary.svg" width="320" style="width:320px" alt="">
  </div>
</body>
</html>
