<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CLAUX Small-Scale Asset QA</title>
  <style>
    :root { color: #3B2E2A; background: #F2E2C8; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 48px; }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: .14em; }
    p { margin: 0 0 34px; color: #0D4547; letter-spacing: .08em; }
    section { display: flex; align-items: end; gap: 28px; margin-bottom: 34px; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 9px; font-size: 12px; }
    .tile { display: grid; place-items: center; min-width: 72px; min-height: 72px; border: 1px solid rgb(59 46 42 / .18); border-radius: 12px; }
    .cocoa { background: #3B2E2A; border-color: #3B2E2A; }
    img { display: block; }
  </style>
</head>
<body>
  <h1>CLAUX / SMALL-SCALE QA</h1>
  <p>MICRO SYMBOL AT 16–32 PX · FULL SYMBOL FROM 32 PX</p>
  <section>
    <figure><div class="tile"><img src="../svg/claux-symbol-micro-primary.svg" width="16" height="16" alt=""></div><figcaption>16px micro</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-micro-primary.svg" width="24" height="24" alt=""></div><figcaption>24px micro</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-micro-primary.svg" width="32" height="32" alt=""></div><figcaption>32px micro</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-micro-primary.svg" width="48" height="48" alt=""></div><figcaption>48px micro</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-micro-primary.svg" width="64" height="64" alt=""></div><figcaption>64px micro</figcaption></figure>
  </section>
  <section>
    <figure><div class="tile cocoa"><img src="../svg/claux-symbol-micro-reverse.svg" width="16" height="16" alt=""></div><figcaption>16px reverse</figcaption></figure>
    <figure><div class="tile cocoa"><img src="../svg/claux-symbol-micro-reverse.svg" width="24" height="24" alt=""></div><figcaption>24px reverse</figcaption></figure>
    <figure><div class="tile cocoa"><img src="../svg/claux-symbol-micro-reverse.svg" width="32" height="32" alt=""></div><figcaption>32px reverse</figcaption></figure>
    <figure><div class="tile cocoa"><img src="../svg/claux-symbol-micro-reverse.svg" width="48" height="48" alt=""></div><figcaption>48px reverse</figcaption></figure>
    <figure><div class="tile cocoa"><img src="../svg/claux-symbol-micro-reverse.svg" width="64" height="64" alt=""></div><figcaption>64px reverse</figcaption></figure>
  </section>
  <section>
    <figure><div class="tile"><img src="../svg/claux-symbol-primary.svg" width="32" height="32" alt=""></div><figcaption>32px full</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-primary.svg" width="48" height="48" alt=""></div><figcaption>48px full</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-primary.svg" width="64" height="64" alt=""></div><figcaption>64px full</figcaption></figure>
    <figure><div class="tile"><img src="../svg/claux-symbol-primary.svg" width="96" height="96" alt=""></div><figcaption>96px full</figcaption></figure>
  </section>
</body>
</html>
